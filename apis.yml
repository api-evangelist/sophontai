description: >-
  Sophont is a frontier medical AI lab (est. 2025) building open, universal,
  multimodal foundation models for medicine, working toward open medical superintelligence
  for clinicians. Its open-weight models are evaluated publicly and built with the
  research community (in collaboration with MedARC), spanning computational pathology
  (OpenMidnight and the nanopath challenge), functional MRI (CortexMAE), fMRI vision
  decoding (Brainmarks), and clinical-text benchmarks (Medmarks). Sophont aims to unify
  every modality of patient data (clinical notes, labs, imaging, pathology, physiological
  signals, genomics, medications, and demographics) into a single model of patient
  state to model disease trajectory, predict intervention response, and accelerate
  biomedical research. Backed by Kindred Ventures. Enrichment note (2026-07-21) —
  Sophont is a research lab that publishes open model weights, benchmarks, and papers;
  it does not currently expose a public developer API, OpenAPI, SDK, or docs portal.
